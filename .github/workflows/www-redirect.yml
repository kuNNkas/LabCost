# Разовая настройка: бакет www.xn--b1ag7a2c.xn--p1ai редиректит на основной домен.
# Через консоль не задать — её валидация поля «Доменное имя» не принимает
# punycode с двойным дефисом. S3 API принимает.
# Запускается вручную: Actions → www redirect → Run workflow.

name: www redirect

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Point www bucket at the apex domain
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws configure set default.s3.addressing_style path
          aws s3api put-bucket-website \
            --endpoint-url https://storage.yandexcloud.net \
            --bucket 'www.xn--b1ag7a2c.xn--p1ai' \
            --website-configuration '{"RedirectAllRequestsTo":{"HostName":"xn--b1ag7a2c.xn--p1ai","Protocol":"https"}}'

          echo "--- итоговая конфигурация ---"
          aws s3api get-bucket-website \
            --endpoint-url https://storage.yandexcloud.net \
            --bucket 'www.xn--b1ag7a2c.xn--p1ai'
