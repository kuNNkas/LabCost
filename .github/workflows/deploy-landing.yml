name: Deploy landing

on:
  push:
    branches: [master]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

env:
  BUCKET: xn--b1ag7a2c.xn--p1ai
  ENDPOINT: https://storage.yandexcloud.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Имя бакета содержит точки, поэтому virtual-host-адресация
      # (bucket.storage.yandexcloud.net) не покрывается wildcard-сертификатом
      # Яндекса и падает по TLS. Path-style обязателен.
      - name: Force path-style addressing
        run: aws configure set default.s3.addressing_style path

      - name: Upload assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync landing/ "s3://$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --exclude '*.html' \
            --cache-control 'public, max-age=3600'

      - name: Upload HTML
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync landing/ "s3://$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --exclude '*' --include '*.html' \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=60'
